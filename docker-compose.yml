services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: polypodium
      POSTGRES_USER: ${DB_USER:-polypodium}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-polypodium} -d polypodium"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build: .
    image: polypodium_server:latest
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql://${DB_USER:-polypodium}:${DB_PASSWORD}@db/polypodium
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      APP_ENV: ${APP_ENV:-production}
      DB_SSL: ${DB_SSL:-false}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      # TLS terminates at the reverse proxy by default; set BEHIND_PROXY=false
      # and provide SSL_CERT_PATH/SSL_KEY_PATH to serve HTTPS directly instead.
      BEHIND_PROXY: ${BEHIND_PROXY:-true}
      REGISTRATION_TOKEN: ${REGISTRATION_TOKEN:-}
      PHOTOS_DIR: /photos
    volumes:
      - photos_data:/photos
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  photos_data:
